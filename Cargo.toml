[package]
authors = ["C J Silverio <ceejceej@gmail.com>"]
default-run = "LOUDBOT"
edition = "2021"
name = "LOUDCRAB"
version = "0.4.2"

[dependencies]
anyhow = "1.0.82"
async-once-cell = "0.5.3"
axum = "0.7.5"
dotenvy = "0.15.7"
#env_logger = "0.9.3"
futures = "0.3.30"
log = "0.4.21"
rand = "0.8.5"
redis = { version = "0.25", features = ["tokio-rustls-comp"] }
regex = "1.10.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.115"
simple_logger = "4.3"
tokio = { version = "1.37", features = ["full"] }

[dependencies.slack_api]
default-features = false
features = ["async", "reqwest", "with_rustls"]
git = "https://github.com/ceejbot/slack-rs-api"
